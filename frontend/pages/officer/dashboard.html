<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Officer — PMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/frontend/assets/css/style.css" rel="stylesheet">
</head>
<body data-pms-fallback="/frontend/pages/login.html">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">PMS — Placement Officer</span>
      <button class="btn btn-outline-light btn-sm" onclick="PMS.logout()">Logout</button>
    </div>
  </nav>
  <div class="container p-4">
    <h2>Placement Officer Dashboard</h2>
    <div id="deptBanner" class="alert alert-info d-none"></div>
    <p>
      <a href="drives.html">Manage Drives</a> ·
      <a href="applications.html">Pending Applications</a> ·
      <a href="students.html">Approve Students</a>
    </p>
    <div class="row mt-4" id="stats"></div>
  </div>
  <script src="/frontend/assets/js/api.js"></script>
  <script src="/frontend/assets/js/nav.js"></script>
  <script>
    PMS.requireAuth(['placement_officer', 'admin']);

    async function init() {
      const banner = document.getElementById('deptBanner');
      const stats = document.getElementById('stats');
      stats.innerHTML = '<div class="col-12"><div class="alert alert-light border mb-0">Loading dashboard…</div></div>';
      try {
        const res = await PMS.get('/officer/profile');
        const profile = res?.data || {};
        const { isAdmin, department } = profile;
        if (isAdmin) {
          banner.className = 'alert alert-secondary';
          banner.textContent = 'Admin view — all departments';
          banner.classList.remove('d-none');
        } else if (department) {
          banner.textContent = `Assigned department: ${department.name} (${department.code})`;
          banner.classList.remove('d-none');
        }

        const [apps, students, drives] = await Promise.allSettled([
          PMS.get('/officer/applications/pending'),
          PMS.get('/officer/students/pending'),
          PMS.get('/officer/drives'),
        ]);
        const appsCount = apps.status === 'fulfilled' ? (apps.value?.data || []).length : '—';
        const studentsCount = students.status === 'fulfilled' ? (students.value?.data || []).length : '—';
        const drivesCount = drives.status === 'fulfilled' ? (drives.value?.data || []).length : '—';
        stats.innerHTML = `
          <div class="col-md-4"><div class="card p-3"><h5>${drivesCount}</h5><small>Drives</small></div></div>
          <div class="col-md-4"><div class="card p-3"><h5>${appsCount}</h5><small>Pending Applications</small></div></div>
          <div class="col-md-4"><div class="card p-3"><h5>${studentsCount}</h5><small>Pending Students</small></div></div>`;

        if (apps.status === 'rejected' || students.status === 'rejected' || drives.status === 'rejected') {
          const note = document.createElement('div');
          note.className = 'alert alert-warning mt-3';
          note.textContent = 'Some dashboard data could not be loaded. The page is still usable.';
          stats.parentElement?.appendChild(note);
        }
      } catch (err) {
        banner.className = 'alert alert-danger';
        banner.textContent = err?.message || 'Could not load placement officer dashboard.';
        banner.classList.remove('d-none');
        stats.innerHTML = '<div class="col-12"><div class="alert alert-warning mb-0">Dashboard data is temporarily unavailable. Try refreshing the page.</div></div>';
      }
    }
    init().catch(() => {});
  </script>
</body>
</html>
