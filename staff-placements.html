  <script src="js/api.js?v=20261008phe"></script>
  <script src="js/officer-api.js?v=20261009branch2"></script>
  <script src="js/app.js?v=20261008phe"></script>
  <script>
    function placementRegistryApi() {
      const role = (typeof Auth !== 'undefined' && Auth.role) ? Auth.role() : '';
      if (role === 'admin' || role === 'placement_officer') return OfficerApi;
      return StaffApi;
    }

    const pageRole = (typeof Auth !== 'undefined' && Auth.role) ? Auth.role() : '';
    if (pageRole !== 'staff' && pageRole !== 'admin' && pageRole !== 'placement_officer') {
      toast('You do not have access to this page.', 'warn');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
    }

    let allRows = [];
    let filteredRows = [];
    let page = 1;
    let pageSize = 25;
    let searchDebounce = null;
    let filterDepartmentId = '';
    let filterProgram = '';
    let filterBranch = '';
    let filterBatch = '';
    let scopeDepartmentId = '';
    let scopeDepartmentName = '';
    let lastFilterBatches = [];
    let lastFilterPrograms = [];
    let sortKey = '';
    let sortDir = 'asc';
    let canEditSelectedBatch = false;
    let apiAssignedBatches = [];
    let registryColumns = [];
    /** Keeps department dropdown when registry API omits filter options (omitFilters=1). */
    let cachedDepartmentOptions = [];
    let cachedProgramOptions = [];
    let cachedBatchOptions = [];

    const SORT_ICON = '<i class="bi bi-chevron-expand registry-sort-icon" aria-hidden="true"></i>';

    function registryColspan() {
      return (registryColumns.length || 16) + 1;
    }

    function columnGroup(col) {
      if (col.group === 'placement' || col.group === 'snapshot') return col.group;
      return col.source === 'student_placements' && col.key !== '_sl' && col.key !== 'studentName'
        && !['registerNumber', 'classBatch', 'programme', 'phone', 'email'].includes(col.key)
        ? 'placement'
        : 'snapshot';
    }

    function setRegistryColumns(cols) {
      if (Array.isArray(cols) && cols.length) {
        registryColumns = cols;
      }
      renderRegistryTableHead();
    }

    function renderRegistryTableHead() {
      const thead = document.getElementById('registryTableHead');
      if (!thead || !registryColumns.length) return;

      const labelRow = registryColumns.map((col) => {
        const label = esc(col.label || col.key || '');
        if (col.sortable === false) {
          return `<th>${label}</th>`;
        }
        const sk = esc(col.sortKey || col.key || '');
        return `<th class="registry-sortable" data-sort="${sk}" data-label="${label}">${label}${SORT_ICON}</th>`;
      }).join('');

      thead.innerHTML = `<tr id="registryTableHeadRow">${labelRow}<th class="registry-actions-col text-center">Actions</th></tr>`;
      updateSortHeaders();
    }

    function rowHasPlacement(r) {
      return String(r.company || r.employer || '').trim() !== '';
    }

    function registryFieldRaw(r, col) {
      const field = col.payloadField || col.key || '';
      switch (field) {
        case 'student':
          return r.student || r.studentName || '';
        case 'admno':
          return r.admno || r.admissionNo || r.registerNumber || '';
        case 'cno':
          return r.cno || r.phone || '';
        case 'year':
          return r.year || r.classBatch || r.batch || '';
        case 'courseid':
          return r.courseid || r.courseId || '';
        case 'branchid':
          return r.branchid || r.branchId || '';
        case 'employer':
          return r.employer || r.company || '';
        case 'empcno':
          return r.empcno || r.empco || r.employerContact || '';
        case 'empadr':
          return r.empadr || r.address || '';
        case 'payscale':
          return r.payscale || r.package || '';
        case 'status':
          return r.status || r.placementStatus || '';
        case 'type':
          return r.type || r.recordType || '';
        case 'createdate':
          return r.createdate || r.createdAt || '';
        case 'updatedate':
          return r.updatedate || r.updatedAt || '';
        default:
          return r[field] ?? r[col.key] ?? '';
      }
    }

    function registryCellValue(col, r, slIndex) {
      const key = col.key || '';
      if (key === '_sl') return `${slIndex}.`;
      if (key === 'student' || key === 'studentName') {
        return esc(String(r.student || r.studentName || '—').toUpperCase());
      }
      const raw = registryFieldRaw(r, col);
      const text = String(raw ?? '').trim();
      return esc(text || '—');
    }

    function registryCellClass(col) {
      const key = col.key || '';
      const group = columnGroup(col);
      const parts = [];
      if (group === 'placement') parts.push('registry-col-placement');
      if (key === 'email') parts.push('registry-col-email');
      if (key === 'employerContact') parts.push('registry-cell-employer-contact');
      if (key === 'address') parts.push('registry-cell-address');
      if (key === 'phone') parts.push('registry-cell-contact');
      return parts.join(' ');
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    function formatContact(row) {
      const phone = String(row.phone || '').trim();
      const email = String(row.email || '').trim();
      const contact = String(row.contact || '').trim();
      if (contact) return contact.replace(/,\s+/g, ',');
      if (phone && email) return `${phone},${email}`;
      return phone || email || '—';
    }

    function rowSortValue(row, key) {
      switch (key) {
        case 'registerNumber':
          return String(row.registerNumber || row.admissionNo || '');
        case 'studentName':
          return String(row.studentName || '');
        case 'classBatch':
          return String(row.classBatch || row.batch || '');
        case 'programme':
          return String(row.programme || row.program || '');
        case 'company':
          return String(row.company || row.employer || '');
        case 'recordType':
          return String(row.recordType || row.type || '');
        case 'contact':
          return formatContact(row);
        default:
          return String(row[key] ?? '');
      }
    }

    function applySort(rows) {
      if (!sortKey) return rows.slice();
      const dir = sortDir === 'desc' ? -1 : 1;
      return rows.slice().sort((a, b) => {
        const va = rowSortValue(a, sortKey).toLowerCase();
        const vb = rowSortValue(b, sortKey).toLowerCase();
        if (va < vb) return -1 * dir;
        if (va > vb) return 1 * dir;
        return 0;
      });
    }

    function updateSortHeaders() {
      document.querySelectorAll('#registryTable .registry-sortable').forEach(th => {
        const key = th.dataset.sort || '';
        const base = th.dataset.label || '';
        const active = key === sortKey;
        th.classList.toggle('is-sorted', active);
        const iconClass = active
          ? `bi bi-chevron-${sortDir === 'desc' ? 'down' : 'up'} registry-sort-icon`
          : 'bi bi-chevron-expand registry-sort-icon';
        th.innerHTML = `${esc(base)}<i class="${iconClass}" aria-hidden="true"></i>`;
      });
    }

    function effectiveDepartmentId() {
      syncDepartmentFilter();
      const deptEl = document.getElementById('filterDepartment');
      if (deptEl && deptEl.value !== '') {
        return deptEl.value;
      }
      if (isCampusPlacementViewer()) {
        return '';
      }
      return filterDepartmentId || scopeDepartmentId || '';
    }

    function currentFilters() {
      alignProgramWithBatchSelection();
      syncDepartmentFilter();
      filterProgram = document.getElementById('filterProgram')?.value ?? filterProgram;
      filterBatch = document.getElementById('filterBatch')?.value ?? filterBatch;
      return {
        departmentId: effectiveDepartmentId(),
        program: filterProgram,
        branch: filterBranch,
        batch: filterBatch,
        studRole: 'all',
        type: document.getElementById('filterType')?.value || '',
        q: document.getElementById('tableSearch')?.value?.trim() || '',
      };
    }

    function applyScopeFromFiltersApi(data) {
      const scope = data?.scope;
      if (!scope || typeof scope !== 'object') return;
      scopeDepartmentId = String(scope.departmentId || '').trim();
      scopeDepartmentName = String(scope.departmentName || scope.departmentCode || '').trim();
      if (isCampusPlacementViewer()) {
        scopeDepartmentId = '';
        return;
      }
      if (!filterDepartmentId && scopeDepartmentId) {
        const deptEl = document.getElementById('filterDepartment');
        if (deptEl && [...deptEl.options].some(o => o.value === scopeDepartmentId)) {
          deptEl.value = scopeDepartmentId;
          syncDepartmentFilter();
        }
      }
    }

    function fillSelect(id, values, allLabel, selected = '', autoPickSingle = false) {
      const el = document.getElementById(id);
      if (!el) return;
      let list = (values || []).map(v => String(v || '').trim()).filter(Boolean);
      if (id === 'filterProgram') {
        if (list.length) cachedProgramOptions = list;
        else if (cachedProgramOptions.length) list = cachedProgramOptions.slice();
      }
      if (id === 'filterBatch') {
        if (list.length) cachedBatchOptions = list;
        else if (cachedBatchOptions.length) list = cachedBatchOptions.slice();
      }
      const current = selected || el.value;
      const labelFor = (v) => {
        const raw = String(v || '').trim();
        if (!raw) return raw;
        if (typeof courseLevelProgrammeLabel === 'function') {
          const course = courseLevelProgrammeLabel(raw);
          if (course) return course;
        }
        if (typeof resolveCollegeProgrammeLabel === 'function') {
          const catalog = resolveCollegeProgrammeLabel(raw);
          if (catalog) return catalog;
        }
        return raw;
      };
      el.innerHTML = `<option value="">${allLabel}</option>` + list.map(v => {
        const value = String(v || '').trim();
        return `<option value="${esc(value)}">${esc(labelFor(value))}</option>`;
      }).join('');
      if (current && [...el.options].some(o => o.value === current)) el.value = current;
      else if (autoPickSingle && list.length === 1) el.value = list[0];
      else el.value = '';
    }

    function assignedBatches() {
      // Prefer server list (registry CT/CoCT only). Ignore stale localStorage dumps.
      if (apiAssignedBatches.length) {
        return [...apiAssignedBatches];
      }
      const u = (typeof Auth !== 'undefined' && Auth.user) ? (Auth.user() || {}) : {};
      const fromUser = Array.isArray(u.assignedClassBatches) ? u.assignedClassBatches : [];
      const profile = u.profile && typeof u.profile === 'object' ? u.profile : {};
      const fromProfile = Array.isArray(profile.assignedClassBatches) ? profile.assignedClassBatches : [];
      const merged = [...new Set([...fromUser, ...fromProfile].map(v => String(v || '').trim()).filter(Boolean))];
      // Client-side guard: huge lists are the old department-wide backfill.
      return merged.length > 12 ? [] : merged;
    }

    function isCampusPlacementViewer() {
      return pageRole === 'admin' || pageRole === 'placement_officer';
    }

    function updateClassTeacherBanner() {
      const el = document.getElementById('classTeacherBanner');
      if (!el) return;
      const assigned = assignedBatches();
      if (!assigned.length && isCampusPlacementViewer()) {
        el.classList.remove('d-none');
        el.className = 'alert alert-info py-2 px-3 mb-3';
        el.textContent = 'Campus-wide view — pick a department and branch above to narrow the list. Add and edit require class-incharge assignment.';
        return;
      }
      if (!assigned.length) {
        el.classList.remove('d-none');
        el.className = 'alert alert-warning py-2 px-3 mb-3';
        el.textContent = 'No class-incharge assignment found for your account. You can view classes, but cannot add or edit placement details.';
        return;
      }
      if (filterBatch && !canEditSelectedBatch) {
        el.classList.remove('d-none');
        el.className = 'alert alert-warning py-2 px-3 mb-3';
        el.textContent = `Only the class teacher / co-class teacher of ${filterBatch} can add or edit entries. Viewing only.`;
        return;
      }
      if (filterBatch && canEditSelectedBatch) {
        el.classList.remove('d-none');
        el.className = 'alert alert-success py-2 px-3 mb-3';
        el.textContent = `You are class incharge for ${filterBatch} — you can add and edit placement / higher-education details.`;
        return;
      }
      el.classList.add('d-none');
      el.textContent = '';
    }

    function cohortKey(batch) {
      const b = String(batch || '').toUpperCase().replace(/\s+/g, '');
      const m = b.match(/^(.*)-S\d+$/i);
      return m ? m[1] : b;
    }

    function batchIsAssigned(batch) {
      const b = String(batch || '').trim();
      if (!b) return false;
      const want = cohortKey(b);
      return assignedBatches().some((a) => {
        const assigned = String(a || '').trim();
        if (!assigned) return false;
        return assigned.toLowerCase() === b.toLowerCase()
          || cohortKey(assigned) === want;
      });
    }

    function batchLooksLikeProgramme(batch, program) {
      const b = String(batch || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      const p = String(program || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!b || !p) return false;
      if (p === 'INMCA') return b.includes('MCAINT') || b.includes('INMCA') || b.includes('INTMCA');
      if (p === 'MCA') return b.startsWith('MCA') && !b.includes('MCAINT') && !b.includes('INMCA');
      if (p === 'BCA') return b.includes('BCA');
      return b.includes(p) || b.startsWith(p);
    }

    function alignProgramWithBatchSelection() {
      if (!filterBatch) return;
      const inferred = programFromBatch(filterBatch);
      if (!inferred) return;
      if (filterProgram && batchLooksLikeProgramme(filterBatch, filterProgram)) return;
      filterProgram = inferred;
      const programEl = document.getElementById('filterProgram');
      if (programEl && [...programEl.options].some(o => o.value === inferred)) {
        programEl.value = inferred;
      }
    }

    function programFromBatch(batch) {
      const b = String(batch || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!b) return '';
      if (b.includes('MCAINT') || b.includes('INMCA') || b.includes('INTMCA')) return 'INMCA';
      if (b.startsWith('MCA')) return 'MCA';
      if (b.includes('BCA')) return 'BCA';
      return '';
    }

    function syncDepartmentFilter() {
      filterDepartmentId = document.getElementById('filterDepartment')?.value ?? '';
    }

    function departmentSelectHasChoices() {
      const el = document.getElementById('filterDepartment');
      if (!el) return false;
      return [...el.options].some(o => String(o.value || '').trim() !== '');
    }

    function fillDepartmentSelect(departments, selected = '') {
      const el = document.getElementById('filterDepartment');
      if (!el) return;
      const normalized = normalizeDepartmentOptions(departments);
      if (!normalized.length) {
        return;
      }
      cachedDepartmentOptions = normalized;
      const current = selected || el.value || '';
      el.innerHTML = '<option value="">All departments</option>' + normalized.map(d => {
        const id = d.id;
        const label = String(d.name || d.code || id).trim();
        return `<option value="${esc(id)}">${esc(label)}</option>`;
      }).join('');
      if (current && [...el.options].some(o => o.value === current)) el.value = current;
      else el.value = '';
      syncDepartmentFilter();
    }

    function restoreDepartmentSelectIfEmpty() {
      if (departmentSelectHasChoices() || !cachedDepartmentOptions.length) return;
      fillDepartmentSelect(cachedDepartmentOptions, filterDepartmentId || scopeDepartmentId);
    }

    function placementFilterCascadeRequired() {
      return isCampusPlacementViewer();
    }

    function updateFilterCascadeState() {
      const needDept = placementFilterCascadeRequired();
      const hasDept = !!String(document.getElementById('filterDepartment')?.value || '').trim();
      const programEl = document.getElementById('filterProgram');
      const batchEl = document.getElementById('filterBatch');
      if (programEl) {
        programEl.disabled = needDept && !hasDept;
        if (needDept && !hasDept) programEl.title = 'Choose a department first';
        else programEl.removeAttribute('title');
      }
      if (batchEl) {
        batchEl.disabled = needDept && !hasDept;
        if (needDept && !hasDept) batchEl.title = 'Choose a department first';
        else batchEl.removeAttribute('title');
      }
    }

    function applyAesBranchHintFromFiltersApi(data) {
      const branches = Array.isArray(data?.branches)
        ? data.branches.map(b => String(b || '').trim()).filter(Boolean)
        : [];
      if (filterBranch) return;
      if (branches.length === 1) {
        filterBranch = branches[0];
        return;
      }
      if (branches.includes('Regular')) {
        filterBranch = 'Regular';
      }
    }

    function resetBranchBatchFiltersForCascade() {
      cachedProgramOptions = [];
      cachedBatchOptions = [];
      filterProgram = '';
      filterBatch = '';
      fillSelect('filterProgram', [], 'Select department first', '', false);
      fillSelect('filterBatch', [], 'Select department first', '', false);
      updateFilterCascadeState();
    }

    function normalizeDepartmentOptions(rows) {
      return (rows || []).map(d => ({
        id: String(d.id || d._id || '').trim(),
        name: String(d.name || '').trim(),
        code: String(d.code || '').trim(),
      })).filter(d => d.id && d.name);
    }

    async function loadDepartmentOptionsFallback() {
      const tryEndpoints = [];
      if (pageRole === 'admin') {
        tryEndpoints.push('/admin/departments');
      }
      tryEndpoints.push('/public/departments');
      for (const path of tryEndpoints) {
        try {
          const res = await api(path);
          const rows = normalizeDepartmentOptions(res?.success && Array.isArray(res.data) ? res.data : []);
          if (!rows.length) continue;
          fillDepartmentSelect(rows, filterDepartmentId || scopeDepartmentId);
          return true;
        } catch (_) {
          /* try next source */
        }
      }
      return false;
    }

    async function loadPlacementFilters() {
      const registryApi = placementRegistryApi();
      if (!registryApi || !registryApi.fetchPlacementFilters) return;

      syncDepartmentFilter();
      updateFilterCascadeState();
      if (placementFilterCascadeRequired() && !filterDepartmentId) {
        resetBranchBatchFiltersForCascade();
        const deptOnly = await registryApi.fetchPlacementFilters({ studRole: 'all' });
        if (deptOnly && Array.isArray(deptOnly.departments) && deptOnly.departments.length) {
          fillDepartmentSelect(deptOnly.departments, filterDepartmentId || scopeDepartmentId);
        } else {
          await loadDepartmentOptionsFallback();
        }
        updateClassTeacherBanner();
        return;
      }
      const initialProgram = filterProgram || '';
      const data = await registryApi.fetchPlacementFilters({
        departmentId: filterDepartmentId,
        program: initialProgram || filterProgram,
        branch: filterBranch || '',
        studRole: 'all',
      });
      if (!data) {
        await loadDepartmentOptionsFallback();
        return;
      }

      if (Array.isArray(data.assignedClassBatches) && data.assignedClassBatches.length) {
        apiAssignedBatches = data.assignedClassBatches.map(v => String(v || '').trim()).filter(Boolean);
      }

      applyScopeFromFiltersApi(data);
      const deptRows = Array.isArray(data.departments) ? data.departments : [];
      if (deptRows.length) {
        fillDepartmentSelect(deptRows, filterDepartmentId || scopeDepartmentId);
      } else {
        await loadDepartmentOptionsFallback();
      }
      if (!filterDepartmentId && scopeDepartmentId) {
        const deptEl = document.getElementById('filterDepartment');
        if (deptEl && [...deptEl.options].some(o => o.value === scopeDepartmentId)) {
          deptEl.value = scopeDepartmentId;
          syncDepartmentFilter();
        }
      }

      let programs = data.programs || [];
      let batches = data.batches || [];
      applyAesBranchHintFromFiltersApi(data);
      lastFilterPrograms = programs;
      lastFilterBatches = batches;
      if ((!programs.length || !batches.length) && filterDepartmentId) {
        const again = await registryApi.fetchPlacementFilters({
          departmentId: filterDepartmentId,
          program: filterProgram || '',
          branch: filterBranch,
          studRole: 'all',
        });
        applyAesBranchHintFromFiltersApi(again);
        batches = again?.batches || batches;
        if (!programs.length && again?.programs?.length) {
          programs = again.programs;
        }
        if (Array.isArray(again?.assignedClassBatches) && again.assignedClassBatches.length) {
          apiAssignedBatches = again.assignedClassBatches.map(v => String(v || '').trim()).filter(Boolean);
        }
      }

      const branchLabel = filterDepartmentId ? 'All branches' : 'Select department first';
      const batchLabel = filterDepartmentId ? (filterProgram ? 'All batches' : 'Select branch first') : 'Select department first';
      fillSelect('filterProgram', programs, branchLabel, filterProgram, false);
      filterProgram = document.getElementById('filterProgram')?.value || '';

      fillSelect('filterBatch', batches, batchLabel, filterBatch, false);
      filterBatch = document.getElementById('filterBatch')?.value || '';
      alignProgramWithBatchSelection();
      // Do not clear canEditSelectedBatch here — loadRegistry() sets it from the
      // server (CT/CoCT). Resetting it made co-class teachers look "view only".
      if (!canEditSelectedBatch && filterBatch) {
        canEditSelectedBatch = batchIsAssigned(filterBatch);
      }
      updateClassTeacherBanner();
      updateFilterCascadeState();

    }

    function applyClientFilter() {
      const q = (document.getElementById('tableSearch')?.value || '').trim().toLowerCase();
      filteredRows = !q ? allRows.slice() : allRows.filter(r => {
        const hay = [
          r.student, r.studentName, r.admno, r.registerNumber, r.admissionNo, r.department,
          r.year, r.classBatch, r.batch, r.courseid, r.courseId, r.branchid, r.branchId,
          r.cno, r.phone, r.email,
          r.employer, r.company, r.empcno, r.employerContact, r.empadr, r.address,
          r.payscale, r.package, r.status, r.placementStatus, r.type, r.recordType,
          r.fordvv, r.includedvv,
        ].join(' ').toLowerCase();
        return hay.includes(q);
      });
      filteredRows = applySort(filteredRows);
      page = 1;
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('registryRows');
      const total = filteredRows.length;
      const pages = Math.max(1, Math.ceil(total / pageSize));
      if (page > pages) page = pages;
      const start = (page - 1) * pageSize;
      const slice = filteredRows.slice(start, start + pageSize);

      if (registryColumns.length) {
        updateSortHeaders();
      }

      document.getElementById('rowCount').textContent = total
        ? `${total} student${total === 1 ? '' : 's'} & alumni`
        : 'No records';
      document.getElementById('pageInfo').textContent = total
        ? `Showing ${start + 1}–${Math.min(start + pageSize, total)} of ${total}`
        : 'No entries to show';

      const colSpan = registryColspan();
      if (!slice.length) {
        tbody.innerHTML = `<tr><td colspan="${colSpan}" class="text-muted-2 p-4 text-center">No students or alumni match the current filters.</td></tr>`;
        return;
      }

      const cols = registryColumns.length ? registryColumns : [];
      tbody.innerHTML = slice.map((r, i) => {
        const slIndex = start + i + 1;
        const sid = esc(r.studentId || '');
        const hasDoc = !!(r.hasOfferLetter || r.hasJoiningLetter || r.hasCompanyIdDoc);
        const hasPlacement = rowHasPlacement(r);
        const rowIndex = start + i;
        const viewBtn = `<button type="button" class="registry-action-btn view" title="View student details" aria-label="View details for ${esc(r.studentName || r.student || 'student')}" onclick="openViewPlacement(${rowIndex})"><i class="bi bi-eye-fill"></i></button>`;
        const downloadBtn = `<button type="button" class="registry-action-btn dl" title="${hasDoc ? 'Download offer letter' : 'No document uploaded'}" ${hasDoc ? '' : 'disabled'} onclick="downloadOffer('${sid}')"><i class="bi bi-download"></i></button>`;
        const detailsBtn = !canEditSelectedBatch
          ? `<button type="button" class="registry-action-btn add" title="Only class incharge can add or edit" disabled><i class="bi bi-lock-fill"></i></button>`
          : (hasPlacement
            ? `<button type="button" class="registry-action-btn ed" title="Edit placement / higher-education details" aria-label="Edit details for ${esc(r.studentName || 'student')}" onclick="openEditPlacement('${sid}')"><i class="bi bi-pencil-fill"></i></button>`
            : `<button type="button" class="registry-action-btn add" title="Add placement / higher-education details" aria-label="Add details for ${esc(r.studentName || 'student')}" onclick="openEditPlacement('${sid}')"><i class="bi bi-plus-lg"></i></button>`);
        const cells = cols.map((col) => {
          const cls = registryCellClass(col);
          const inner = registryCellValue(col, r, slIndex);
          if (col.key === 'student' || col.key === 'studentName') {
            return `<td${cls ? ` class="${cls}"` : ''}><span class="registry-student-name">${inner}</span></td>`;
          }
          return `<td${cls ? ` class="${cls}"` : ''}>${inner}</td>`;
        }).join('');
        return `<tr>${cells}<td><div class="registry-actions">${viewBtn}${downloadBtn}${detailsBtn}</div></td></tr>`;
      }).join('');
    }

    function findRowByStudentId(studentId) {
      return filteredRows.find(r => String(r.studentId) === String(studentId))
        || allRows.find(r => String(r.studentId) === String(studentId))
        || null;
    }

    const VIEW_IDENTITY_KEYS = ['student', 'admno', 'stud_role', 'email', 'year', 'courseid', 'branchid'];

    function viewPlacementColumns() {
      const source = registryColumns.length
        ? registryColumns
        : [
          'student', 'admno', 'stud_role', 'cno', 'email', 'year', 'courseid', 'branchid',
          'employer', 'empcno', 'empadr', 'payscale', 'status', 'createdBy', 'updatedBy',
          'updatedate', 'fordvv', 'type', 'includedvv', 'createdate',
        ].map((key) => ({ key, label: key, payloadField: key }));
      return source.filter((col) => (col.key || '') !== '_sl');
    }

    function openViewPlacement(rowIndex) {
      const row = filteredRows[rowIndex];
      if (!row) {
        toast('Record not found.', 'warn');
        return;
      }
      const columns = viewPlacementColumns();
      const byKey = new Map(columns.map((col) => [col.key, col]));
      const name = String(row.student || row.studentName || 'Student').trim();
      const title = document.getElementById('viewPlacementTitle');
      if (title) title.textContent = name || 'Student details';
      const identity = document.getElementById('viewPlacementIdentity');
      if (identity) {
        identity.innerHTML = VIEW_IDENTITY_KEYS.map((key) => {
          const col = byKey.get(key) || { key, label: key, payloadField: key };
          return `<div class="col-md-6 col-lg-4"><div class="view-field-label">${esc(col.label || key)}</div><div class="view-field-value">${registryCellValue(col, row, 0)}</div></div>`;
        }).join('');
      }
      const skip = new Set(VIEW_IDENTITY_KEYS);
      const detailCols = columns.filter((col) => !skip.has(col.key || ''));
      const head = document.getElementById('viewPlacementHead');
      const body = document.getElementById('viewPlacementBody');
      if (head) {
        head.innerHTML = detailCols.length
          ? detailCols.map((col) => `<th>${esc(col.label || col.key || '')}</th>`).join('')
          : '<th>Details</th>';
      }
      if (body) {
        body.innerHTML = detailCols.length
          ? `<tr>${detailCols.map((col) => `<td>${registryCellValue(col, row, 0)}</td>`).join('')}</tr>`
          : '<tr><td class="text-muted-2">No other details for this student.</td></tr>';
      }
      bootstrap.Modal.getOrCreateInstance(document.getElementById('viewPlacementModal')).show();
    }

    function openEditPlacement(studentId) {
      if (!canEditSelectedBatch) {
        toast('Only the class incharge (class teacher / co-class teacher) can add or edit entries for this batch.', 'warn');
        return;
      }
      const row = findRowByStudentId(studentId);
      if (!row) {
        toast('Record not found.', 'warn');
        return;
      }
      document.getElementById('editStudentId').value = row.studentId || '';
      document.getElementById('editStudentName').value = row.studentName || '';
      document.getElementById('editEmployer').value = row.employer || '';
      document.getElementById('editRole').value = row.role || '';
      document.getElementById('editType').value = (
        row.type === 'Higher Education' || row.type === 'Research'
          ? row.type
          : 'Placement'
      );
      document.getElementById('editPackage').value = row.package || '';
      document.getElementById('editEmployerContact').value = row.employerContact || '';
      document.getElementById('editAddress').value = row.address || '';
      document.getElementById('editJoinDate').value = row.joinDate || '';
      document.getElementById('editEndDate').value = row.endDate || '';
      document.getElementById('editPlacementStatus').value = row.placementStatus || '';
      document.getElementById('editOfferLetterVerified').value = row.offerLetterVerified ? 'true' : 'false';
      document.getElementById('editVerificationDate').value = row.verificationDate || '';
      document.getElementById('editFordvv').value = row.fordvv ?? '';
      document.getElementById('editIncludedvv').value = row.includedvv ?? '';
      if (typeof resetFilePickers === 'function') {
        resetFilePickers(['editEvidenceFile']);
      } else {
        const ev = document.getElementById('editEvidenceFile');
        if (ev) ev.value = '';
      }
      syncEditTypeFields();
      bootstrap.Modal.getOrCreateInstance(document.getElementById('editPlacementModal')).show();
    }

    function openUploadPlacement(studentId) {
      const row = findRowByStudentId(studentId);
      if (!row) {
        toast('Record not found.', 'warn');
        return;
      }
      document.getElementById('uploadStudentId').value = row.studentId || '';
      document.getElementById('uploadStudentLabel').textContent = `${row.studentName || 'Student'} · ${row.employer || 'Employer'}`;
      if (typeof resetFilePickers === 'function') {
        resetFilePickers(['uploadOfferLetter', 'uploadJoiningLetter', 'uploadCompanyIdDoc']);
      } else {
        document.getElementById('uploadOfferLetter').value = '';
        document.getElementById('uploadJoiningLetter').value = '';
        document.getElementById('uploadCompanyIdDoc').value = '';
      }
      bootstrap.Modal.getOrCreateInstance(document.getElementById('uploadPlacementModal')).show();
    }

    async function saveEditPlacement(ev) {
      ev.preventDefault();
      if (!canEditSelectedBatch) {
        toast('Only the class incharge (class teacher / co-class teacher) can submit placement details for this batch.', 'warn');
        return;
      }
      const studentId = document.getElementById('editStudentId').value;
      const payload = {
        employer: document.getElementById('editEmployer').value.trim(),
        role: document.getElementById('editRole').value.trim(),
        type: document.getElementById('editType').value,
        package: document.getElementById('editPackage').value.trim(),
        employerContact: document.getElementById('editEmployerContact').value.trim(),
        address: document.getElementById('editAddress').value.trim(),
        joinDate: document.getElementById('editJoinDate').value,
        endDate: document.getElementById('editEndDate').value,
        placementStatus: document.getElementById('editPlacementStatus').value,
        offerLetterVerified: document.getElementById('editOfferLetterVerified').value === 'true',
        verificationDate: document.getElementById('editVerificationDate').value,
        fordvv: document.getElementById('editFordvv').value.trim(),
        includedvv: document.getElementById('editIncludedvv').value.trim(),
      };
      if (!payload.employer) {
        toast(window.__editTypeRequiredMsg || 'Employer / institution name is required.', 'warn');
        return;
      }
      const evidence = document.getElementById('editEvidenceFile')?.files?.[0] || null;
      const btn = document.getElementById('editPlacementSaveBtn');
      const label = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = 'Submitting…';
      const res = await StaffApi.updateStudentPlacement(studentId, payload);
      if (!res?.success) {
        btn.disabled = false;
        btn.innerHTML = label;
        toast(res?.message || 'Could not update placement.', 'error');
        return;
      }
      const savedId = String(res?.data?.studentId || studentId);
      if (evidence) {
        const fd = new FormData();
        fd.append('offerLetter', evidence, evidence.name);
        const up = await StaffApi.uploadStudentPlacementDocuments(savedId, fd);
        if (!up?.success) {
          btn.disabled = false;
          btn.innerHTML = label;
          applySubmittedRow(studentId, savedId, payload, false);
          toast(up?.message || 'Details saved, but evidence upload failed.', 'warn');
          await loadRegistry();
          return;
        }
        applySubmittedRow(studentId, savedId, payload, true);
      } else {
        applySubmittedRow(studentId, savedId, payload, false);
      }
      btn.disabled = false;
      btn.innerHTML = label;
      bootstrap.Modal.getOrCreateInstance(document.getElementById('editPlacementModal')).hide();
      toast(evidence ? 'Placement details and evidence submitted.' : 'Placement details submitted.', 'success');
      await loadRegistry();
    }

    function applySubmittedRow(oldStudentId, savedStudentId, payload, hasOfferLetter) {
      const patch = (row) => {
        if (String(row.studentId) !== String(oldStudentId) && String(row.studentId) !== String(savedStudentId)) {
          return row;
        }
        return {
          ...row,
          studentId: savedStudentId || row.studentId,
          employer: payload.employer,
          role: payload.role || row.role || '',
          type: payload.type || row.type || 'Placement',
          package: payload.package || '',
          employerContact: payload.employerContact || '',
          address: payload.address || '',
          joinDate: payload.joinDate || '',
          endDate: payload.endDate || '',
          placementStatus: payload.placementStatus || '',
          offerLetterVerified: !!payload.offerLetterVerified,
          verificationDate: payload.verificationDate || '',
          fordvv: payload.fordvv ?? '',
          includedvv: payload.includedvv ?? '',
          hasOfferLetter: hasOfferLetter || !!row.hasOfferLetter,
          source: row.source === 'class_roster' ? 'placement' : (row.source || 'placement'),
        };
      };
      allRows = allRows.map(patch);
      filteredRows = filteredRows.map(patch);
      renderTable();
    }

    async function saveUploadPlacement(ev) {
      ev.preventDefault();
      const studentId = document.getElementById('uploadStudentId').value;
      const offer = document.getElementById('uploadOfferLetter').files?.[0];
      const joining = document.getElementById('uploadJoiningLetter').files?.[0];
      const companyId = document.getElementById('uploadCompanyIdDoc').files?.[0];
      if (!offer && !joining && !companyId) {
        toast('Choose at least one document to upload.', 'warn');
        return;
      }
      const fd = new FormData();
      if (offer) fd.append('offerLetter', offer, offer.name);
      if (joining) fd.append('joiningLetter', joining, joining.name);
      if (companyId) fd.append('companyIdDoc', companyId, companyId.name);
      const btn = document.getElementById('uploadPlacementSaveBtn');
      const label = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = 'Uploading…';
      const res = await StaffApi.uploadStudentPlacementDocuments(studentId, fd);
      btn.disabled = false;
      btn.innerHTML = label;
      if (!res?.success) {
        toast(res?.message || 'Could not upload documents.', 'error');
        return;
      }
      bootstrap.Modal.getOrCreateInstance(document.getElementById('uploadPlacementModal')).hide();
      toast('Documents uploaded.', 'success');
      await loadRegistry();
    }

    function applyRegistryPayload(data) {
      if (!data || typeof data !== 'object') return false;
      if (Array.isArray(data.columns) && data.columns.length) {
        setRegistryColumns(data.columns);
      }
      allRows = Array.isArray(data.rows) ? data.rows : [];
      if (Array.isArray(data.assignedClassBatches)) {
        apiAssignedBatches = data.assignedClassBatches.map(v => String(v || '').trim()).filter(Boolean);
        try {
          const u = (typeof Auth !== 'undefined' && Auth.user) ? (Auth.user() || {}) : {};
          if (typeof Auth !== 'undefined' && Auth.set) {
            Auth.set({ ...u, assignedClassBatches: apiAssignedBatches });
          }
        } catch (_) { /* ignore */ }
      }
      const registryDepts = data.filters?.departments;
      if (Array.isArray(registryDepts) && registryDepts.length) {
        fillDepartmentSelect(registryDepts, filterDepartmentId);
      }
      restoreDepartmentSelectIfEmpty();
      canEditSelectedBatch = data.canEditBatch === true;
      updateClassTeacherBanner();
      applyClientFilter();
      return true;
    }

    async function loadRegistry() {
      const tbody = document.getElementById('registryRows');
      syncDepartmentFilter();
      tbody.innerHTML = `<tr><td colspan="${registryColspan()}" class="text-muted-2 p-4 text-center">Loading registry…</td></tr>`;
      const registryApi = placementRegistryApi();
      const data = await registryApi.fetchPlacementsHigherEducation(currentFilters());
      if (!data) {
        const detail = (registryApi._lastPlacementsFetchError || '').trim();
        const msg = detail
          ? esc(detail)
          : 'Could not load the placements registry. Refresh and try again.';
        tbody.innerHTML = `<tr><td colspan="${registryColspan()}" class="text-danger p-4 text-center">${msg}</td></tr>`;
        if (detail && typeof toast === 'function') toast(detail, 'error');
        return;
      }
      applyRegistryPayload(data);
    }

    async function onScopeFilterChange(changed) {
      const registryApi = placementRegistryApi();
      if (typeof registryApi.clearPlacementsCache === 'function') {
        registryApi.clearPlacementsCache();
      }
      try {
      if (changed === 'filterDepartment') {
        syncDepartmentFilter();
        filterProgram = '';
        filterBranch = '';
        filterBatch = '';
        cachedProgramOptions = [];
        cachedBatchOptions = [];
        const programEl = document.getElementById('filterProgram');
        const batchEl = document.getElementById('filterBatch');
        if (programEl) programEl.value = '';
        if (batchEl) batchEl.value = '';
        if (!filterDepartmentId && placementFilterCascadeRequired()) {
          resetBranchBatchFiltersForCascade();
        } else {
          await loadPlacementFilters();
        }
      } else if (changed === 'filterProgram') {
        filterProgram = document.getElementById('filterProgram')?.value || '';
        filterBranch = '';
        filterBatch = '';
        cachedBatchOptions = [];
        const batchEl = document.getElementById('filterBatch');
        if (batchEl) batchEl.value = '';
        await loadPlacementFilters();
      } else if (changed === 'filterBatch') {
        filterBatch = document.getElementById('filterBatch')?.value || '';
        alignProgramWithBatchSelection();
      }

      await loadRegistry();
      } catch (err) {
        const tbody = document.getElementById('registryRows');
        const msg = esc(err?.message || 'Could not refresh the registry.');
        if (tbody) {
          tbody.innerHTML = `<tr><td colspan="${registryColspan()}" class="text-danger p-4 text-center">${msg}</td></tr>`;
        }
        if (typeof toast === 'function') toast(err?.message || 'Could not refresh filters.', 'error');
      }
    }

    async function downloadOffer(studentId) {
      const token = localStorage.getItem('ph-token') || '';
      const url = `/backend/api/staff/students/${encodeURIComponent(studentId)}/self-placement/offer-letter`;
      try {
        const res = await fetch(url, { headers: token ? { Authorization: `Bearer ${token}` } : {} });
        if (!res.ok) throw new Error('Download failed');
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'offer-letter.pdf';
        a.click();
        URL.revokeObjectURL(a.href);
      } catch {
        toast('Could not download offer letter.', 'warn');
      }
    }

    ['filterDepartment', 'filterProgram', 'filterBatch'].forEach(id => {
      document.getElementById(id)?.addEventListener('change', () => {
        onScopeFilterChange(id).catch(() => loadRegistry());
      });
    });
    document.getElementById('filterType')?.addEventListener('change', () => {
      const registryApi = placementRegistryApi();
      if (typeof registryApi.clearPlacementsCache === 'function') {
        registryApi.clearPlacementsCache();
      }
      loadRegistry();
    });
    document.getElementById('tableSearch')?.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(applyClientFilter, 200);
    });
    document.getElementById('pageSize')?.addEventListener('change', (e) => {
      pageSize = Number(e.target.value) || 25;
      page = 1;
      renderTable();
    });
    document.getElementById('btnPrev')?.addEventListener('click', () => { if (page > 1) { page--; renderTable(); } });
    document.getElementById('btnNext')?.addEventListener('click', () => {
      const pages = Math.max(1, Math.ceil(filteredRows.length / pageSize));
      if (page < pages) { page++; renderTable(); }
    });
    document.getElementById('editPlacementForm')?.addEventListener('submit', saveEditPlacement);
    document.getElementById('editType')?.addEventListener('change', syncEditTypeFields);
    document.getElementById('uploadPlacementForm')?.addEventListener('submit', saveUploadPlacement);
    document.getElementById('registryTable')?.addEventListener('click', (e) => {
      const th = e.target.closest('.registry-sortable');
      if (!th) return;
      const key = th.dataset.sort || '';
      if (!key) return;
      if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortKey = key; sortDir = 'asc'; }
      filteredRows = applySort(filteredRows);
      page = 1;
      renderTable();
    });

    onAppReady(async () => {
      if (typeof wireFilePickers === 'function') {
        wireFilePickers('#editPlacementModal');
        wireFilePickers('#uploadPlacementModal');
      }
      syncDepartmentFilter();
      setRegistryColumns([
        'student', 'admno', 'stud_role', 'cno', 'email', 'year', 'courseid', 'branchid',
        'employer', 'empcno', 'empadr', 'payscale', 'status', 'createdBy',
        'updatedBy', 'updatedate', 'fordvv', 'type', 'includedvv', 'createdate',
      ].map((key) => ({
        key,
        label: key,
        sortable: true,
        sortKey: key,
        source: 'student_placement_details',
        group: 'record',
        payloadField: key,
      })));
      // Prefer assigned class from session so the class list can load in one request.
      if (typeof staffClassInchargeBatches === 'function') {
        apiAssignedBatches = staffClassInchargeBatches();
      } else {
        const u = Auth.user() || {};
        apiAssignedBatches = Array.isArray(u.assignedClassBatches) ? u.assignedClassBatches : [];
      }
      const registryApi = placementRegistryApi();
      if (registryApi && typeof registryApi.clearPlacementsCache === 'function') {
        registryApi.clearPlacementsCache();
      }
      try {
        await loadPlacementFilters();
      } catch (err) {
        await loadDepartmentOptionsFallback();
        if (typeof toast === 'function') {
          toast(err?.message || 'Could not load filter dropdowns.', 'warn');
        }
      }
      await loadRegistry();
    });
  </script>
</body>
