<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Autonomous MCQ · AJCE Placements</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="css/style.css?v=20260725responsive" rel="stylesheet"/>
<style>
  .syl-course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.75rem}
  .syl-course-card{
    border:1px solid var(--border);border-radius:.85rem;padding:1rem;background:#fff;text-align:left;
    cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease;height:100%;
  }
  .syl-course-card:hover{border-color:color-mix(in srgb,var(--primary) 35%,var(--border));box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .syl-course-icon{font-size:1.35rem;line-height:1;margin-bottom:.45rem;color:var(--primary)}
  .apt-prob-list{border:1px solid var(--border,#e5e7eb);border-radius:.75rem;overflow:hidden;background:#fff}
  .apt-prob-row{
    display:grid;grid-template-columns:1.6rem minmax(0,1fr) 4.6rem 4.2rem;
    align-items:center;gap:.75rem;padding:.85rem 1rem;border:0;width:100%;
    background:#fff;text-align:left;color:inherit;
  }
  .apt-prob-row:nth-child(even){background:#f8fafc}
  .apt-prob-row:hover{background:#f1f5f9}
  .apt-prob-row.is-clickable{cursor:pointer}
  .apt-prob-check{color:#22c55e;font-size:1rem;line-height:1}
  .apt-prob-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .apt-prob-pct{color:#94a3b8;font-size:.9rem;text-align:right;font-variant-numeric:tabular-nums}
  .apt-prob-time{font-size:.9rem;font-weight:500;text-align:right;color:#64748b}
</style>
</head>
<body data-page="autonomous-mcq.html"><div class="app">
<aside class="sidebar" id="sidebar"></aside><div class="main"><header class="topbar" id="topbar"></header><main class="page">

<div class="page-header">
  <div>
    <h1 class="page-title">Autonomous MCQ</h1>
    <p class="page-sub mb-0">Study the question bank, then attend an MCQ test.</p>
  </div>
</div>

<ul class="nav nav-tabs mb-3" role="tablist">
  <li class="nav-item" role="presentation">
    <button class="nav-link active" id="tabStudyBtn" data-bs-toggle="tab" data-bs-target="#tabStudy" type="button" role="tab">Question bank</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="tabTestBtn" data-bs-toggle="tab" data-bs-target="#tabTest" type="button" role="tab">MCQ</button>
  </li>
</ul>

<div class="tab-content">
  <div class="tab-pane fade show active" id="tabStudy" role="tabpanel">
    <div id="studyPanel"></div>
  </div>
  <div class="tab-pane fade" id="tabTest" role="tabpanel">
    <p class="small text-muted-2 mb-3 d-none" id="testHint"></p>
    <div id="testPanel"></div>
  </div>
</div>

</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=20261001mcqback"></script>
<script src="js/app.js?v=20261001mcqback"></script>
<script>
let study = { courses: [] };
let openStudy = '';
let tests = [];
let attempt = null;
let timer = 0;

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setHint(text) {
  const el = document.getElementById('testHint');
  const value = String(text || '').trim();
  el.textContent = value;
  el.classList.toggle('d-none', value === '');
}

function clearTimer() {
  if (timer) window.clearInterval(timer);
  timer = 0;
}

function courseStudyCard(course) {
  const code = String(course.courseCode || '').trim();
  const courseName = String(course.courseTitle || '').trim();
  const count = (course.questions || []).length;
  const meta = courseName && courseName !== code
    ? `${courseName} · ${count} question${count === 1 ? '' : 's'}`
    : `${count} question${count === 1 ? '' : 's'}`;
  return `
    <button type="button" class="syl-course-card" data-open-study="${esc(code)}">
      <div class="syl-course-icon"><i class="bi bi-diagram-3"></i></div>
      <div class="fw-semibold">${esc(code)}</div>
      <div class="small text-muted-2 mt-1">${esc(meta)}</div>
    </button>`;
}

function mcqCourseCodeName(test) {
  const codes = String(test.courseCode || (test.courseCodes || []).join(', ') || '').trim();
  const courseName = String(test.courseTitle || '').trim();
  if (codes && courseName && courseName !== codes) return `${codes} · ${courseName}`;
  return codes || courseName;
}

function mcqListLabel(test) {
  const customTitle = String(test.title || '').trim();
  const codes = String(test.courseCode || (test.courseCodes || []).join(', ') || '').trim();
  const codeName = mcqCourseCodeName(test);
  if (!customTitle || customTitle === codes) return codeName || 'MCQ';
  if (codeName && customTitle !== codeName && !customTitle.includes(codes)) {
    return `${customTitle} · ${codeName}`;
  }
  return customTitle || codeName || 'MCQ';
}

function mcqTestRow(test, index) {
  const count = Number(test.questionCount || 0);
  const minutes = Number(test.durationMinutes || 0);
  const title = mcqListLabel(test);
  const timeLabel = minutes ? `${minutes} min` : '—';
  return `
    <button type="button" class="apt-prob-row is-clickable" data-start-test="${esc(test.id)}">
      <span class="apt-prob-check"></span>
      <span class="apt-prob-title">${index + 1}. ${esc(title)}</span>
      <span class="apt-prob-pct">${count} Q</span>
      <span class="apt-prob-time">${esc(timeLabel)}</span>
    </button>`;
}

function renderStudy() {
  const panel = document.getElementById('studyPanel');
  const groups = Array.isArray(study.courses) ? study.courses : [];
  const open = groups.find((course) => String(course.courseCode || '').toUpperCase() === openStudy);
  if (openStudy && !open) openStudy = '';
  if (!groups.length) {
    panel.innerHTML = '<p class="text-muted-2 mb-0">No questions in the bank yet.</p>';
    return;
  }
  if (open) {
    const rows = open.questions || [];
    panel.innerHTML = `
      <div class="d-flex align-items-center gap-2 mb-3">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-study-back aria-label="Back"><i class="bi bi-arrow-left"></i></button>
        <div>
          <h2 class="h5 mb-0">${esc(open.courseCode)}</h2>
          <div class="small text-muted-2">${rows.length} question${rows.length === 1 ? '' : 's'} for study</div>
        </div>
      </div>
      ${rows.map((q, i) => {
        const options = (q.options || []).map((opt, idx) => {
          const mark = idx === q.correctIndex ? ' fw-semibold' : '';
          const right = idx === q.correctIndex ? ' <span class="badge-soft success">Answer</span>' : '';
          return `<li class="${mark} mb-1">${esc(opt)}${right}</li>`;
        }).join('');
        const description = String(q.description || q.explanation || '').trim();
        return `
          <article class="card-surface p-3 p-md-4 mb-3">
            <div class="fw-semibold mb-2">Q${i + 1}. ${esc(q.question)}</div>
            <ol class="mb-2 ps-3" type="A">${options}</ol>
            ${description ? `<div class="small text-muted-2">${esc(description)}</div>` : ''}
          </article>`;
      }).join('')}`;
    return;
  }
  panel.innerHTML = `<div class="syl-course-grid">${groups.map((course) => courseStudyCard(course)).join('')}</div>`;
}

function renderTests() {
  const panel = document.getElementById('testPanel');
  if (attempt?.sessionId && !attempt.results) return;
  if (!tests.length) {
    panel.innerHTML = '<p class="text-muted-2 mb-0">No MCQ tests yet.</p>';
    return;
  }
  panel.innerHTML = `<div class="apt-prob-list">${tests.map((test, i) => mcqTestRow(test, i)).join('')}</div>`;
}

function renderQuiz(payload) {
  attempt = payload;
  const panel = document.getElementById('testPanel');
  const rows = payload?.questions || [];
  const minutes = Number(payload?.durationMinutes || 0);
  setHint('');
  panel.innerHTML = `
    <div class="d-flex align-items-center gap-2 mb-3">
      <button type="button" class="btn btn-sm btn-outline-secondary" id="btnBackTests" aria-label="Back"><i class="bi bi-arrow-left"></i></button>
      <div class="d-flex flex-wrap justify-content-between gap-2 flex-grow-1">
      <div>
        <h2 class="h5 mb-1">${esc(mcqListLabel(payload))}</h2>
        <p class="small text-muted-2 mb-0">${esc(mcqCourseCodeName(payload) || '')}</p>
      </div>
      <div class="d-flex gap-2 align-items-center">
        ${minutes ? `<span class="fw-semibold" id="mcqTimer" data-seconds="${minutes * 60}">${String(minutes).padStart(2, '0')}:00</span>` : ''}
        <span class="badge-soft info">${rows.length} question${rows.length === 1 ? '' : 's'}</span>
      </div>
      </div>
    </div>
    ${rows.map((q, i) => `
      <article class="card-surface p-3 p-md-4 mb-3">
        <div class="fw-semibold mb-2">Q${i + 1}. ${esc(q.question)}</div>
        ${(q.options || []).map((opt, idx) => `
          <label class="d-flex gap-2 align-items-start mb-2">
            <input class="form-check-input mt-1" type="radio" name="stu${i}" value="${idx}">
            <span>${esc(opt)}</span>
          </label>`).join('')}
      </article>`).join('')}
    <button type="button" class="btn btn-primary" id="btnSubmitTest">Submit answers</button>`;
  clearTimer();
  const el = document.getElementById('mcqTimer');
  if (!el) return;
  let left = Number(el.getAttribute('data-seconds') || 0);
  timer = window.setInterval(() => {
    left -= 1;
    const m = Math.max(0, Math.floor(left / 60));
    const s = Math.max(0, left % 60);
    el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    if (left <= 0) {
      clearTimer();
      submitTest();
    }
  }, 1000);
}

function renderResult(payload) {
  clearTimer();
  attempt = Object.assign({}, attempt || {}, { results: payload.results || [], sessionId: '' });
  const results = payload.results || [];
  document.getElementById('testPanel').innerHTML = `
    <div class="d-flex align-items-center gap-2 mb-3">
      <button type="button" class="btn btn-sm btn-outline-secondary" id="btnBackTests" aria-label="Back"><i class="bi bi-arrow-left"></i></button>
      <div>
        <div class="small text-muted-2">${esc(payload.title || payload.courseCode || 'MCQ')}</div>
        <div class="h4 mb-0">${esc(payload.score ?? 0)} / ${esc(payload.total ?? results.length)}</div>
      </div>
    </div>
    ${results.map((q, i) => {
      const options = (q.options || []).map((opt, idx) => {
        const yours = idx === q.selectedIndex ? ' <span class="badge-soft ' + (q.correct ? 'success' : 'danger') + '">Your answer</span>' : '';
        const right = idx === q.correctIndex ? ' <span class="badge-soft success">Answer</span>' : '';
        return `<li class="${idx === q.correctIndex ? 'fw-semibold' : ''} mb-1">${esc(opt)}${yours}${right}</li>`;
      }).join('');
      return `
        <article class="card-surface p-3 p-md-4 mb-3">
          <div class="d-flex justify-content-between gap-2 mb-2">
            <div class="fw-semibold">Q${i + 1}. ${esc(q.question)}</div>
            <span class="badge-soft ${q.correct ? 'success' : 'danger'}">${q.correct ? 'Correct' : 'Incorrect'}</span>
          </div>
          <ol class="mb-2 ps-3" type="A">${options}</ol>
          ${q.explanation ? `<div class="small text-muted-2">${esc(q.explanation)}</div>` : ''}
        </article>`;
    }).join('')}`;
}

async function loadStudy() {
  const res = await api('/student/autonomous-mcq/bank');
  if (!res?.success) throw new Error(res?.message || 'Could not load the question bank.');
  study = res.data || { courses: [] };
  renderStudy();
}

async function loadTests() {
  const res = await api('/student/autonomous-mcq/tests');
  if (!res?.success) throw new Error(res?.message || 'Could not load MCQ tests.');
  tests = Array.isArray(res.data?.tests) ? res.data.tests : [];
  renderTests();
}

async function startTest(id) {
  setHint('Starting the MCQ…');
  try {
    const res = await api('/student/autonomous-mcq/start', {
      method: 'POST',
      body: JSON.stringify({ testId: id }),
    });
    if (!res?.success) throw new Error(res?.message || 'Could not start the MCQ.');
    renderQuiz(res.data || {});
  } catch (err) {
    setHint(err?.message || 'Could not start the MCQ.');
  }
}

async function submitTest() {
  if (!attempt?.sessionId) return;
  clearTimer();
  const answers = (attempt.questions || []).map((_, i) => {
    const picked = document.querySelector(`input[name="stu${i}"]:checked`);
    return picked ? Number(picked.value) : -1;
  });
  const button = document.getElementById('btnSubmitTest');
  if (button) button.disabled = true;
  try {
    const res = await api('/student/autonomous-mcq/submit', {
      method: 'POST',
      body: JSON.stringify({ sessionId: attempt.sessionId, answers }),
    });
    if (!res?.success) throw new Error(res?.message || 'Could not submit the MCQ.');
    renderResult(res.data || {});
  } catch (err) {
    setHint(err?.message || 'Could not submit the MCQ.');
    if (button) button.disabled = false;
  }
}

document.getElementById('studyPanel').addEventListener('click', (event) => {
  const open = event.target.closest('[data-open-study]');
  if (open) {
    openStudy = String(open.getAttribute('data-open-study') || '').toUpperCase();
    renderStudy();
    return;
  }
  if (event.target.closest('[data-study-back]')) {
    openStudy = '';
    renderStudy();
  }
});
document.getElementById('testPanel').addEventListener('click', (event) => {
  const start = event.target.closest('[data-start-test]');
  if (start) {
    startTest(start.getAttribute('data-start-test') || '');
    return;
  }
  if (event.target.closest('#btnSubmitTest')) submitTest();
  if (event.target.closest('#btnBackTests')) {
    clearTimer();
    attempt = null;
    renderTests();
  }
});
document.getElementById('tabTestBtn').addEventListener('shown.bs.tab', () => {
  if (attempt?.sessionId && !attempt.results) return;
  loadTests().catch((err) => setHint(err?.message || 'Could not load MCQ tests.'));
});

onAppReady(() => {
  if ((typeof Auth !== 'undefined' && Auth.role ? Auth.role() : '') !== 'student') {
    location.href = 'dashboard.html';
    return;
  }
  loadStudy().catch(() => {
    document.getElementById('studyPanel').innerHTML = '<p class="text-danger mb-0">Could not load the question bank.</p>';
  });
  loadTests().catch(() => {});
});
</script>
</body></html>
