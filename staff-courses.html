<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Syllabus · AJCE Placements</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="css/style.css?v=20260725responsive" rel="stylesheet"/>
</head>
<body data-page="staff-courses.html"><div class="app">
<aside class="sidebar" id="sidebar"></aside><div class="main"><header class="topbar" id="topbar"></header><main class="page">

<div class="page-header">
  <div>
    <h1 class="page-title">Syllabus</h1>
    <p class="page-sub mb-0">Search a course code, open its syllabus, then generate questions from it.</p>
  </div>
</div>

<div class="card-surface p-3 p-md-4 mb-3">
  <label class="form-label small fw-semibold" for="courseSearch">Course code</label>
  <div class="d-flex gap-2">
    <input class="form-control" id="courseSearch" type="search" placeholder="Type at least 3 letters, for example 26M" autocomplete="off" />
    <button type="button" class="btn btn-primary flex-shrink-0" id="btnGet">Get</button>
  </div>
  <div class="border rounded mt-2 d-none" id="courseResults" style="max-height:16rem;overflow:auto"></div>
  <div class="form-text" id="deptLabel">Type at least 3 letters of a course code.</div>
</div>

<div id="syllabusPanel" class="card-surface p-3 p-md-4 mb-3">
  <p class="text-muted-2 mb-0">Select a course code to see the syllabus.</p>
</div>

<div class="d-flex flex-wrap gap-2 align-items-center mb-3">
  <button type="button" class="btn btn-primary" id="btnGenerate" disabled>
    <i class="bi bi-stars me-1"></i>Generate questions
  </button>
  <span class="small text-muted-2" id="genStatus"></span>
</div>

<div id="practicePanel"></div>

<div class="modal fade" id="generateModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Generate questions</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted-2 mb-3" id="generateCourseLabel"></p>
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label small fw-semibold" for="qCount">No. of questions</label>
            <select class="form-select" id="qCount">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="15">15</option>
              <option value="20">20</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small fw-semibold" for="qDifficulty">Difficulty</label>
            <select class="form-select" id="qDifficulty">
              <option>Easy</option>
              <option selected>Medium</option>
              <option>Hard</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btnConfirmGenerate">
          <i class="bi bi-stars me-1"></i>Generate questions
        </button>
      </div>
    </div>
  </div>
</div>

</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=20260930syllabussearch"></script>
<script src="js/app.js?v=20260930syllabussearch"></script>
<script>
let courses = [];
let picked = null;
let practice = null;
let searchTimer = 0;
let searchSeq = 0;

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function selectedCourse() {
  return picked;
}

function renderCourseResults(total) {
  const box = document.getElementById('courseResults');
  if (!courses.length) {
    box.classList.remove('d-none');
    box.innerHTML = '<div class="p-2 small text-muted-2">No courses match that search in your department.</div>';
    return;
  }
  const more = total > courses.length
    ? `<div class="p-2 small text-muted-2 border-top">Showing ${courses.length} of ${total}. Type more letters to narrow the list.</div>`
    : '';
  box.classList.remove('d-none');
  box.innerHTML = courses.map((course, index) => `
    <button type="button" class="btn btn-light w-100 border-0 border-bottom rounded-0" data-pick="${index}" style="justify-content:flex-start;text-align:left">
      <span class="fw-semibold">${esc(course.code)}</span>
      <span class="text-muted-2"> — ${esc(course.title)}</span>
      ${course.semsubId ? `<span class="text-muted-2"> · ${esc(course.semsubId)}</span>` : ''}
    </button>`).join('') + more;
}

async function searchCourses() {
  const query = document.getElementById('courseSearch').value.trim();
  const box = document.getElementById('courseResults');
  const label = document.getElementById('deptLabel');
  if (query.length < 3) {
    courses = [];
    box.classList.add('d-none');
    box.innerHTML = '';
    label.textContent = 'Type at least 3 letters of a course code.';
    return;
  }
  const seq = ++searchSeq;
  label.textContent = 'Searching…';
  try {
    const res = await api('/staff/courses/search?q=' + encodeURIComponent(query));
    if (seq !== searchSeq) return;
    if (!res?.success) throw new Error(res?.message || 'Could not search courses.');
    courses = Array.isArray(res.data?.courses) ? res.data.courses : [];
    const deptName = String(res.data?.departmentName || '').trim();
    const total = Number(res.data?.total || courses.length);
    label.textContent = deptName ? `Showing courses for ${deptName}.` : 'Showing courses for your department.';
    renderCourseResults(total);
  } catch (err) {
    if (seq !== searchSeq) return;
    courses = [];
    box.classList.remove('d-none');
    box.innerHTML = `<div class="p-2 small text-danger">${esc(err?.message || 'Could not search courses.')}</div>`;
    label.textContent = '';
  }
}

async function getSelectedCourse() {
  const query = document.getElementById('courseSearch').value.trim();
  const label = document.getElementById('deptLabel');
  const button = document.getElementById('btnGet');
  if (!picked || (query && picked.code && query.toUpperCase() !== String(picked.code).toUpperCase())) {
    await searchCourses();
    const exact = courses.find((c) => String(c.code).toUpperCase() === query.toUpperCase());
    if (exact) picked = exact;
  }
  if (!picked?.semsubId) {
    label.textContent = 'Select a course from the list, then click Get.';
    return;
  }
  button.disabled = true;
  label.textContent = 'Loading course…';
  try {
    const res = await api('/staff/courses/get', {
      method: 'POST',
      body: JSON.stringify({
        semsubId: picked.semsubId,
        courseCode: picked.code,
      }),
    });
    if (!res?.success) throw new Error(res?.message || 'Could not load that course.');
    picked = Object.assign({}, picked, res.data || {});
    document.getElementById('courseSearch').value = picked.code || query;
    document.getElementById('courseResults').classList.add('d-none');
    practice = null;
    document.getElementById('practicePanel').innerHTML = '';
    document.getElementById('genStatus').textContent = '';
    const deptName = String(res.data?.departmentName || '').trim();
    label.textContent = deptName ? `Showing courses for ${deptName}.` : 'Course loaded.';
    renderSyllabus();
  } catch (err) {
    label.textContent = err?.message || 'Could not load that course.';
  } finally {
    button.disabled = false;
  }
}

function renderSyllabus() {
  const course = selectedCourse();
  const panel = document.getElementById('syllabusPanel');
  document.getElementById('btnGenerate').disabled = !course;
  if (!course) {
    panel.innerHTML = '<p class="text-muted-2 mb-0">Search for a course code to see the syllabus.</p>';
    return;
  }
  const modules = (course.modules || []).map((mod) => `
    <div class="col-md-6">
      <div class="border rounded p-3 h-100">
        <div class="fw-semibold mb-1">${esc(mod.name)}</div>
        <div class="text-muted-2">${esc(mod.topics)}</div>
      </div>
    </div>`).join('');
  panel.innerHTML = `
    <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
      <div>
        <div class="small text-muted-2">${[course.scheme, course.department].filter(Boolean).map(esc).join(' · ')}</div>
        <h2 class="h5 mb-0">${esc(course.code)} — ${esc(course.title)}</h2>
        ${course.semsubId ? `<div class="small text-muted-2">Semester subject id ${esc(course.semsubId)}</div>` : ''}
        ${course.encid ? `<div class="small text-muted-2">Encoded id ${esc(course.encid)}</div>` : ''}
      </div>
    </div>
    <div class="row g-3">${modules}</div>`;
}

function renderPractice(payload) {
  practice = payload;
  const rows = payload?.questions || [];
  const root = document.getElementById('practicePanel');
  if (!rows.length) {
    root.innerHTML = '';
    return;
  }
  root.innerHTML = `
    <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
      <h2 class="h5 mb-0">Practice session · ${esc(payload.courseCode)} ${esc(payload.courseTitle || '')}</h2>
      <span class="badge-soft info">${esc(payload.difficulty || '')} · ${rows.length} questions</span>
    </div>
    ${rows.map((q, i) => {
      const options = (q.options || []).map((opt, idx) => `
        <label class="d-flex gap-2 align-items-start border rounded p-2 mb-2">
          <input class="form-check-input mt-1" type="radio" name="q${i}" value="${idx}"/>
          <span>${esc(opt)}</span>
        </label>`).join('');
      return `
        <article class="card-surface p-3 p-md-4 mb-3">
          <div class="d-flex flex-wrap justify-content-between gap-2 mb-2">
            <div class="fw-semibold">Q${i + 1}. ${esc(q.question)}</div>
            ${q.module ? `<span class="badge-soft info">${esc(q.module)}</span>` : ''}
          </div>
          ${options}
        </article>`;
    }).join('')}
    <button type="button" class="btn btn-primary" id="btnSubmitPractice">Submit practice</button>`;
  document.getElementById('btnSubmitPractice').addEventListener('click', submitPractice);
}

function renderResult(payload) {
  practice = null;
  const results = payload?.results || [];
  const root = document.getElementById('practicePanel');
  root.innerHTML = `
    <div class="card-surface p-3 p-md-4 mb-3">
      <div class="small text-muted-2">Practice result · ${esc(payload.courseCode || '')}</div>
      <div class="h4 mb-0">${esc(payload.score ?? 0)} / ${esc(payload.total ?? results.length)}</div>
    </div>
    ${results.map((q, i) => {
      const options = (q.options || []).map((opt, idx) => {
        let mark = '';
        if (idx === q.correctIndex) mark = 'fw-semibold';
        const yours = idx === q.selectedIndex ? ' <span class="badge-soft ' + (q.correct ? 'success' : 'danger') + '">Your answer</span>' : '';
        const right = idx === q.correctIndex ? ' <span class="badge-soft success">Answer</span>' : '';
        return `<li class="${mark} mb-1">${esc(opt)}${yours}${right}</li>`;
      }).join('');
      return `
        <article class="card-surface p-3 p-md-4 mb-3">
          <div class="d-flex flex-wrap justify-content-between gap-2 mb-2">
            <div class="fw-semibold">Q${i + 1}. ${esc(q.question)}</div>
            <span class="badge-soft ${q.correct ? 'success' : 'danger'}">${q.correct ? 'Correct' : 'Incorrect'}</span>
          </div>
          <ol class="mb-2 ps-3" type="A">${options}</ol>
          ${q.explanation ? `<div class="small text-muted-2">${esc(q.explanation)}</div>` : ''}
        </article>`;
    }).join('')}`;
}

async function generate() {
  const course = selectedCourse();
  if (!course) return;
  const button = document.getElementById('btnConfirmGenerate');
  const status = document.getElementById('genStatus');
  button.disabled = true;
  status.textContent = 'Generating a practice session from the syllabus…';
  document.getElementById('practicePanel').innerHTML = '';
  try {
    const res = await api('/staff/courses/questions', {
      method: 'POST',
      body: JSON.stringify({
        courseCode: course.code,
        semsubId: course.semsubId || '',
        encid: course.encid || '',
        count: Number(document.getElementById('qCount').value),
        difficulty: document.getElementById('qDifficulty').value,
      }),
    });
    if (!res?.success) throw new Error(res?.message || 'Could not generate questions.');
    const count = (res.data?.questions || []).length;
    status.textContent = `${count} question${count === 1 ? '' : 's'} from ${course.code}.`;
    const modalEl = document.getElementById('generateModal');
    bootstrap.Modal.getOrCreateInstance(modalEl).hide();
    renderPractice(res.data);
  } catch (err) {
    status.textContent = '';
    document.getElementById('practicePanel').innerHTML = `<div class="card-surface p-3 text-danger">${esc(err?.message || 'Could not generate questions.')}</div>`;
  } finally {
    button.disabled = false;
  }
}

async function submitPractice() {
  if (!practice?.sessionId) return;
  const answers = (practice.questions || []).map((_, i) => {
    const picked = document.querySelector(`input[name="q${i}"]:checked`);
    return picked ? Number(picked.value) : -1;
  });
  const button = document.getElementById('btnSubmitPractice');
  if (button) button.disabled = true;
  const status = document.getElementById('genStatus');
  status.textContent = 'Checking answers…';
  try {
    const res = await api('/staff/courses/questions/submit', {
      method: 'POST',
      body: JSON.stringify({ sessionId: practice.sessionId, answers }),
    });
    if (!res?.success) throw new Error(res?.message || 'Could not submit the practice session.');
    status.textContent = `Score ${res.data?.score ?? 0} / ${res.data?.total ?? 0}.`;
    renderResult(res.data);
  } catch (err) {
    status.textContent = '';
    if (button) button.disabled = false;
    if (typeof toast === 'function') toast(err?.message || 'Could not submit the practice session.', 'error');
  }
}

document.getElementById('courseSearch').addEventListener('input', () => {
  window.clearTimeout(searchTimer);
  searchTimer = window.setTimeout(searchCourses, 300);
});
document.getElementById('courseSearch').addEventListener('keydown', (event) => {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  window.clearTimeout(searchTimer);
  searchCourses();
});
document.getElementById('btnGet').addEventListener('click', () => {
  window.clearTimeout(searchTimer);
  getSelectedCourse();
});
document.getElementById('courseResults').addEventListener('click', (event) => {
  const button = event.target.closest('[data-pick]');
  if (!button) return;
  const course = courses[Number(button.getAttribute('data-pick'))];
  if (!course) return;
  picked = course;
  document.getElementById('courseSearch').value = course.code;
  document.getElementById('courseResults').classList.add('d-none');
  practice = null;
  document.getElementById('practicePanel').innerHTML = '';
  document.getElementById('genStatus').textContent = '';
  renderSyllabus();
});
document.getElementById('btnGenerate').addEventListener('click', () => {
  const course = selectedCourse();
  if (!course) return;
  document.getElementById('generateCourseLabel').textContent = `${course.code} — ${course.title}`;
  bootstrap.Modal.getOrCreateInstance(document.getElementById('generateModal')).show();
});
document.getElementById('btnConfirmGenerate').addEventListener('click', generate);

onAppReady(() => {
  const role = typeof Auth !== 'undefined' && Auth.role ? Auth.role() : '';
  const hod = typeof Auth !== 'undefined' && typeof Auth.isHod === 'function' && Auth.isHod();
  if (role !== 'staff' && !hod) {
    location.href = 'dashboard.html';
  }
});
</script>
</body></html>
